name: CI

on:
  push:
    branches-ignore:
      - qa-preview
  workflow_dispatch:

# Keep only the newest validation for each branch. Older queued builds must not
# monopolize the same physical self-hosted Windows machine.
concurrency:
  group: nrs-workbench-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # Local runner policy: use built-in Windows PowerShell, not pwsh/PowerShell 7.
    shell: powershell

jobs:
  windows-build-and-smoke:
    # Security policy: this public repository never runs pull_request events on the
    # repository-scoped self-hosted runner. Only trusted pushes or manual runs execute locally.
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Ensure local Git is on PATH
        run: |
          if (-not (Get-Command git -ErrorAction SilentlyContinue)) {
            $gitCmd = 'C:\Program Files\Git\cmd'
            $gitExe = Join-Path $gitCmd 'git.exe'
            if (-not (Test-Path $gitExe)) {
              throw "Git is required but was not found in PATH or at $gitExe"
            }
            $gitCmd | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH = "$gitCmd;$env:PATH"
          }
          git --version

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Enforce local runners
        shell: powershell
        run: ./scripts/check-local-runners.ps1

      - name: Verify local toolchain (.NET SDK)
        run: dotnet --info

      - name: Verify local toolchain (Git)
        run: git --version

      - name: Validate local launcher PowerShell syntax
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\scripts\build-and-run.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "::error::$($_.Message)" }
            throw "build-and-run.ps1 contains PowerShell syntax errors."
          }

          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\scripts\run-preview.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "::error::$($_.Message)" }
            throw "run-preview.ps1 contains PowerShell syntax errors."
          }

      - name: Validate release note extraction
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\\scripts\\get-release-notes.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "::error::$($_.Message)" }
            throw "get-release-notes.ps1 contains PowerShell syntax errors."
          }

          [xml]$props = Get-Content -LiteralPath '.\\Directory.Build.props'
          $version = [string]$props.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Directory.Build.props does not define Version."
          }
          .\\scripts\\get-release-notes.ps1 -Version $version | Out-Null

          # Regression: Windows PowerShell 5.1 must preserve UTF-8 release
          # notes when building the GitHub release JSON request body.
          foreach ($releaseVersion in @('0.18.6', '0.18.7')) {
            $notes = (.\scripts\get-release-notes.ps1 -Version $releaseVersion) -join "`n"
            if ($releaseVersion -eq '0.18.6' -and $notes -notmatch '[^\x00-\x7F]') {
              throw "Expected non-ASCII release notes for v$releaseVersion."
            }
            $json = @{ tag_name = "v$releaseVersion"; body = $notes } | ConvertTo-Json
            $bytes = [System.Text.Encoding]::UTF8.GetBytes($json)
            $decoded = [System.Text.Encoding]::UTF8.GetString($bytes) | ConvertFrom-Json
            if ($decoded.body -cne $notes) {
              throw "UTF-8 release JSON round-trip failed for v$releaseVersion."
            }
          }

      - name: Restore
        run: dotnet restore .\NRSWorkbench.sln

      - name: Build
        run: dotnet build .\NRSWorkbench.sln -c Release --no-restore

      - name: Git safety smoke tests
        run: dotnet run --project .\tests\NRS.Workbench.SmokeTests\NRS.Workbench.SmokeTests.csproj -c Release

      - name: Public source audit
        run: .\scripts\public-audit.ps1

      # Local-only candidate packaging check. No tag, release, upload, or signing.
      - name: Portable distribution smoke (no upload)
        run: |
          .\scripts\publish-win-x64.ps1
          $zip = Join-Path $env:RUNNER_TEMP "NRSWorkbench-ci-$env:GITHUB_RUN_ID.zip"
          try {
            Compress-Archive -Path .\dist\win-x64\* -DestinationPath $zip -Force
            if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw "Candidate ZIP is missing." }
            if ((Get-Item -LiteralPath $zip).Length -lt 1MB) { throw "Candidate ZIP is unexpectedly small." }
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
            try {
              $exeEntries = @($archive.Entries | Where-Object { $_.FullName -eq 'NRSWorkbench.exe' })
              if ($exeEntries.Count -ne 1 -or $exeEntries[0].Length -lt 1MB) {
                throw "Candidate ZIP is missing a valid NRSWorkbench.exe entry."
              }
            }
            finally { $archive.Dispose() }
          }
          finally { if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force } }
