name: Promote approved v0.18.2

# One-time promotion for the approved v0.18.2 release. Only a successful
# trusted CI run on the current main commit may create the release tag.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: nrs-workbench-approved-v0.18.2
  cancel-in-progress: false

defaults:
  run:
    shell: powershell

jobs:
  promote-approved-release:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Ensure local Git is on PATH
        run: |
          if (-not (Get-Command git -ErrorAction SilentlyContinue)) {
            $gitCmd = 'C:\Program Files\Git\cmd'
            $gitExe = Join-Path $gitCmd 'git.exe'
            if (-not (Test-Path $gitExe)) { throw "Git was not found." }
            $gitCmd | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH = "$gitCmd;$env:PATH"
          }
          git --version

      - name: Checkout exactly the successful CI commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Promote v0.18.2 only after matching successful CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v0.18.2'
          $assetName = 'NRSWorkbench-v0.18.2-win-x64.zip'
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $releaseUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          $tagRefs = @(git ls-remote --tags origin "refs/tags/$tag")
          if ($LASTEXITCODE -ne 0) { throw "Could not check remote tags." }

          if ($tagRefs.Count -gt 0) {
            try {
              $release = Invoke-RestMethod -Method Get -Uri $releaseUrl -Headers $headers -ErrorAction Stop
              if (@($release.assets | Where-Object { $_.name -eq $assetName }).Count -gt 0) {
                Write-Host "$tag has its published ZIP; nothing to do."
                exit 0
              }
            }
            catch {
              if ($null -eq $_.Exception.Response -or [int]$_.Exception.Response.StatusCode -ne 404) { throw }
            }
            Write-Host "Tag exists but ZIP is absent; retrying the idempotent release workflow."
          }
          else {
            $checkedOut = (git rev-parse HEAD).Trim()
            $remoteLine = @(git ls-remote origin refs/heads/main)
            if ($LASTEXITCODE -ne 0 -or $remoteLine.Count -ne 1) { throw "Could not verify main HEAD." }
            $remoteMain = ($remoteLine[0] -split '\s+')[0]
            if ($checkedOut -ne $env:VERIFIED_SHA -or $remoteMain -ne $env:VERIFIED_SHA) {
              throw "The successful CI commit is no longer the current main HEAD."
            }
            $props = Get-Content -Raw -LiteralPath 'Directory.Build.props'
            if ($props -notmatch '<Version>0\.18\.2</Version>' -or
                $props -notmatch '<FileVersion>0\.18\.2\.0</FileVersion>') {
              throw "The successful CI commit is not the approved v0.18.2 build."
            }
            git config user.name 'NRS Workbench CI'
            git config user.email 'nrs-workbench-ci@example.invalid'
            git tag -a $tag -m 'NRS Workbench v0.18.2 Public Preview'
            if ($LASTEXITCODE -ne 0) { throw "Could not create release tag." }
            git push origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Could not push release tag." }
            Write-Host "Created approved release tag $tag at $env:VERIFIED_SHA."
          }

          # Tag pushes created with GITHUB_TOKEN do not trigger push workflows,
          # so explicitly dispatch the existing tag-scoped Release workflow.
          $dispatchUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/release.yml/dispatches"
          $body = @{ ref = $tag } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri $dispatchUrl -Headers $headers -ContentType 'application/json' -Body $body
          Write-Host "Dispatched the existing tag-scoped release workflow for $tag."
