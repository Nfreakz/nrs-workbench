name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

defaults:
  run:
    # Local runner policy: use built-in Windows PowerShell, not pwsh/PowerShell 7.
    shell: powershell

jobs:
  release-win-x64:
    # Project policy: releases must run only on a repository-scoped local self-hosted Windows x64 runner.
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify local release toolchain
        run: |
          dotnet --info
          git --version

      - name: Build
        run: dotnet build .\NRSWorkbench.sln -c Release

      - name: Git safety smoke tests
        run: dotnet run --project .\tests\NRS.Workbench.SmokeTests\NRS.Workbench.SmokeTests.csproj -c Release

      - name: Public source audit
        run: .\scripts\public-audit.ps1

      - name: Publish portable win-x64
        run: .\scripts\publish-win-x64.ps1

      - name: Package
        run: |
          $name = "NRSWorkbench-$env:GITHUB_REF_NAME-win-x64.zip"
          Compress-Archive -Path .\dist\win-x64\* -DestinationPath $name -Force
          "PACKAGE=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create or reuse GitHub prerelease and upload package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          $tag = $env:GITHUB_REF_NAME
          $encodedTag = [System.Uri]::EscapeDataString($tag)
          $releaseByTagUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$encodedTag"

          try {
            $release = Invoke-RestMethod -Method Get -Uri $releaseByTagUri -Headers $headers -ErrorAction Stop
            Write-Host "Reusing existing prerelease for $tag."
          }
          catch {
            $response = $_.Exception.Response
            if ($null -eq $response -or [int]$response.StatusCode -ne 404) { throw }

            $body = @{
              tag_name = $tag
              name = "NRS Workbench $tag"
              generate_release_notes = $true
              prerelease = $true
            } | ConvertTo-Json

            $release = Invoke-RestMethod -Method Post `
              -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases" `
              -Headers $headers `
              -ContentType 'application/json' `
              -Body $body
          }

          $existingAsset = @($release.assets | Where-Object { $_.name -eq $env:PACKAGE })
          if ($existingAsset.Count -gt 0) {
            Write-Host "Release asset already exists: $env:PACKAGE"
            exit 0
          }

          $uploadUrl = $release.upload_url -replace '\{\?name,label\}$', ''
          $assetName = [System.Uri]::EscapeDataString($env:PACKAGE)
          $uploadUri = '{0}?name={1}' -f $uploadUrl, $assetName

          Invoke-RestMethod -Method Post `
            -Uri $uploadUri `
            -Headers $headers `
            -ContentType 'application/zip' `
            -InFile $env:PACKAGE | Out-Null

          Write-Host "Uploaded release asset: $env:PACKAGE"
