name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-win-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build .\NRSWorkbench.sln -c Release

      - name: Git safety smoke tests
        run: dotnet run --project .\tests\NRS.Workbench.SmokeTests\NRS.Workbench.SmokeTests.csproj -c Release

      - name: Public source audit
        shell: pwsh
        run: .\scripts\public-audit.ps1

      - name: Publish portable win-x64
        shell: pwsh
        run: .\scripts\publish-win-x64.ps1

      - name: Package
        shell: pwsh
        run: |
          $name = "NRSWorkbench-$env:GITHUB_REF_NAME-win-x64.zip"
          Compress-Archive -Path .\dist\win-x64\* -DestinationPath $name -Force
          "PACKAGE=$name" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" "$env:PACKAGE" --generate-notes --title "NRS Workbench $env:GITHUB_REF_NAME"
